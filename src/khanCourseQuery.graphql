fragment LessonChild on LearnableContent {
  id
  translatedTitle
  translatedDescription
  kind
  thumbnailUrl
  contentDescriptor
  contentId
  ... on Video {
    duration
    downloadUrls
    translatedYoutubeId
    kaUrl
    youtubeId
    downloadSizes
    __typename
  }
  __typename
}
query CourseQueryV8($courseId: String!) {
  content {
    metadata {
      commitSha
      __typename
    }
    __typename
  }
  topicById(id: $courseId) {
    ...TopicBaseFragment
    subjectMasteryEnabled
    masteryEnabled
    parent {
      parentTitle: translatedTitle
      __typename
    }
    courseChallenge {
      exerciseLength
      timeEstimate {
        lowerBound
        upperBound
        __typename
      }
      __typename
    }
    children(mobileBlacklistVersion: 1) {
      __typename
      ...LessonChild
      ... on Topic {
        ...TopicBaseFragment
        masteryEnabled
        slug
        children(mobileBlacklistVersion: 1) {
          __typename
          ...LessonChild
          ... on TopicQuiz {
            slug
            progressKey
            timeEstimate {
              lowerBound
              upperBound
              __typename
            }
            exerciseLength
            coveredExercises {
              id
              __typename
            }
            coveredTutorials {
              id
              key
              __typename
            }
            __typename
          }
          ... on TopicUnitTest {
            slug
            progressKey
            timeEstimate {
              lowerBound
              upperBound
              __typename
            }
            exerciseLength
            coveredExercises {
              id
              __typename
            }
            coveredTutorials {
              id
              key
              __typename
            }
            __typename
          }
          ... on Topic {
            ...TopicBaseFragment
            children(mobileBlacklistVersion: 1) {
              __typename
              ...LessonChild
            }
            __typename
          }
        }
        __typename
      }
    }
    __typename
  }
  __typename
}
fragment TopicBaseFragment on Topic {
  id
  translatedTitle
  translatedDescription
  iconPath
  largeIconPath
  curriculum {
    key
    name
    country
    region
    __typename
  }
  __typename
}